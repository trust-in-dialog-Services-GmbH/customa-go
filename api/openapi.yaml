    AuthTokenResponseV4:
      description: Response body of a successful authentication login request or token
        refresh.
      example:
        Token: 044600149b8a50a2d00a32bc4ff9ac4bbdcdf82565e6b0900ded9daa4db77b55cb75eb58c71ae17af8634da8cce5d464735379f9b45c9ca4d3367d6eea9ea185
        ValidUntil: 2024-12-31T23:59:59Z
      properties:
        Token:
          description: "Random, hex encoded 64 Bytes used as a token for authentication.\
            \ The content of this token is not relevant, but it should be treated\
            \ as a secret and stored securely. It is recommended to refresh the token\
            \ at least 10 minutes before it expires to ensure uninterrupted access\
            \ to the API."
          example: 044600149b8a50a2d00a32bc4ff9ac4bbdcdf82565e6b0900ded9daa4db77b55cb75eb58c71ae17af8634da8cce5d464735379f9b45c9ca4d3367d6eea9ea185
          title: API Access Token.
          type: string
        ValidUntil:
          description: "The timestamp on which the token expires, provided in RFC3339\
            \ Format."
          example: 2024-12-31T23:59:59Z
          format: date-time
          title: Expiration Timestamp.
          type: string
      required:
      - Token
      - ValidUntil
      title: Authentication Token Response
      type: object
    ErrorResponseV4:
      description: Response body for an error response.
      example:
        Message: Something bad happened.
        Code: 42
      properties:
        Code:
          default: 0
          description: A numeric code representing the error. A list of error codes
            and their meanings can be found in the documentation.
          example: 42
          title: Error Code.
          type: integer
        Message:
          default: ""
          description: A message giving feedback about the error. The recipient's
            logic must not rely on its content.
          example: Something bad happened.
          title: Error Message.
          type: string
      title: Error Response
      type: object
