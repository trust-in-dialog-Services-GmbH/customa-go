openapi: 3.0.0
info:
  description: E-Commerce BI & CRM Tool
  title: Customa
  version: 3.6.0
servers:
- description: Customa
  url: https://www.customa.biz/
security:
- Token: []
tags:
- description: auth
  name: auth
- description: customer
  name: customer
- description: product
  name: product
- description: receipt
  name: receipt
- description: search
  name: search
- description: stats
  name: stats
paths:
  /api/v3/auth/login:
    post:
      description: |-
        A user is authenticated using their username and password and a project ID. If the credentials are valid, a token
        is returned that can be used for further API requests. The token is valid for a limited time and can be refreshed
        using the refresh endpoint. It is recommended to refresh the token at least 10 minutes before it expires to
        ensure uninterrupted access to the API.
      operationId: auth_login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: The authentication was successful.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: The request body is invalid or malformed.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid credentials provided or insufficient permissions.
      security: []
      summary: Authentication of a user for the API
      tags:
      - auth
  /api/v3/auth/logout:
    post:
      description: The logout endpoint allows a user to manually invalidate their
        current API authentication token.
      operationId: auth_logout
      responses:
        "200":
          description: The current token was successfully deleted.
      summary: Manually invalidate an API Auth Token.
      tags:
      - auth
  /api/v3/auth/refresh:
    post:
      description: |-
        This endpoint allows a user to refresh their current API authentication token. The current token will be
        invalidated, and a new token will be issued with an updated expiration time.
      operationId: auth_refresh
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
          description: The current token was successfully refreshed.
      summary: Refresh an API Auth Token
      tags:
      - auth
  /api/v3/customer:
    post:
      description: A new customer is created and the ID of the created customer is
        returned.
      operationId: customer_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictCustomer"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreatedResponse"
          description: The customer was successfully created.
      summary: Creates a new Customer.
      tags:
      - customer
  /api/v3/customer/{id}:
    delete:
      operationId: customer_delete
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: The customer was found and deleted.
        "404":
          description: The customer was not found.
        "409":
          description: The customer could not be deleted because it is referenced
            by other entities.
      summary: Deletes a customer with the given ID.
      tags:
      - customer
    get:
      operationId: customer_get
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrictCustomer"
          description: The customer was found.
        "404":
          description: The customer was not found.
      summary: Retrieves a customer by their ID.
      tags:
      - customer
    patch:
      description: |-
        This method allows for partial updates to a customer's data. Only the fields provided in the request body will
        be updated, leaving other fields unchanged.
      operationId: customer_patch
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Customer"
        required: true
      responses:
        "200":
          description: The customer was successfully updated.
        "404":
          description: The customer was not found.
      summary: Updates a customer with the given ID partially.
      tags:
      - customer
    put:
      description: |-
        The customer must already exist in the system. All customer data is replaced with the data provided in the
        request body.
      operationId: customer_put
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictCustomer"
        required: true
      responses:
        "200":
          description: The customer was successfully updated.
        "404":
          description: The customer was not found.
      summary: Overwrites a customer with the given ID.
      tags:
      - customer
  /api/v3/customer/search:
    post:
      description: |-
        Using the search endpoint, customers can be filtered based on various criteria, which are combined using the
        boolean AND operator. Multiple values can be provided for a filter, these will be combined using the boolean OR
        operator. The results returned are paginated and sorted by the ID in ascending order.

        **Please note:** As Customa may choose a lower page size than the provided one, it is recommended to use the
        value returned by the first request when scrolling through multiple result pages.
      operationId: customer_search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSearchResponse"
          description: A search response with customers matching the search criteria.
      summary: Searches for customers by the given filters.
      tags:
      - customer
  /api/v3/product:
    post:
      description: A new product is created using the provided data. The product ID
        is returned in the response.
      operationId: product_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictProduct"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreatedResponse"
          description: The product was successfully created.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: A product with this number already exists.
      summary: Creates a new Product.
      tags:
      - product
  /api/v3/product/{id}:
    delete:
      operationId: product_delete
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: The product was successfully deleted.
        "404":
          description: The product was not found.
        "409":
          description: The product cannot be deleted because it is referenced by other
            entities.
      summary: Deletes a product by its ID.
      tags:
      - product
    get:
      operationId: product_get
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrictProduct"
          description: The product was successfully retrieved.
        "404":
          description: The product was not found.
      summary: Retrieves a product by its ID.
      tags:
      - product
    patch:
      description: |-
        This method allows for partial updates to a product's data. Only the fields provided in the request body will be
        updated.
      operationId: product_patch
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
        required: true
      responses:
        "200":
          description: The product was successfully updated.
        "404":
          description: The product was not found.
      summary: Updates a product partially by its ID.
      tags:
      - product
    put:
      description: The product must already exist. The provided data will replace
        the existing product data.
      operationId: product_put
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictProduct"
        required: true
      responses:
        "200":
          description: The product was successfully updated.
        "404":
          description: The product was not found.
      summary: Overwrites an existing product with the given ID.
      tags:
      - product
  /api/v3/product/search:
    post:
      description: |-
        Using the search endpoint, products can be filtered based on various criteria, which are combined using the
        boolean AND operator. Multiple values can be provided for a filter, these will be combined using the boolean OR
        operator. The results returned are paginated and sorted by the ID in ascending order.

        **Please note:** As Customa may choose a lower page size than the provided one, it is recommended to use the
        value returned by the first request when scrolling through multiple result pages.
      operationId: product_search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSearchResponse"
          description: A search response with products matching the search criteria.
      summary: Searches for products by the given filters.
      tags:
      - product
  /api/v3/receipt:
    post:
      description: A receipt is created using the provided JSON data. The ID of the
        created receipt is returned in the response.
      operationId: receipt_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictReceipt"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreatedResponse"
          description: The receipt was successfully created.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: A receipt with this number already exists.
      summary: Creates a new receipt.
      tags:
      - receipt
  /api/v3/receipt/{id}:
    delete:
      operationId: receipt_delete
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: The receipt was successfully deleted.
        "404":
          description: The receipt was not found.
      summary: Deletes a receipt by its ID.
      tags:
      - receipt
    get:
      operationId: receipt_get
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrictReceipt"
          description: The receipt was successfully retrieved.
        "404":
          description: The receipt was not found.
      summary: Retrieves a receipt by its ID.
      tags:
      - receipt
    patch:
      description: |-
        The receipt must already exist. The provided data will be merged with the existing receipt data. Any receipt
        item that is not present in the request will remain unchanged. If the provided data contains receipt items, the
        existing receipt items will be replaced with the provided items.
      operationId: receipt_patch
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Receipt"
        required: true
      responses:
        "200":
          description: The receipt was successfully updated.
        "404":
          description: The receipt was not found.
      summary: Partially updates an existing receipt with the given ID.
      tags:
      - receipt
    put:
      description: |-
        The receipt must already exist. The provided data will replace the existing receipt data. Any receipt item that
        is not present in the request will be removed from the receipt.
      operationId: receipt_put
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictReceipt"
        required: true
      responses:
        "200":
          description: The receipt was successfully updated.
        "404":
          description: The receipt was not found.
      summary: Overwrites an existing receipt with the given ID.
      tags:
      - receipt
  /api/v3/receipt/search:
    post:
      description: |-
        Using the search endpoint, receipts can be filtered based on various criteria, which are combined using the
        boolean AND operator. Multiple values can be provided for a filter, these will be combined using the boolean OR
        operator. The results returned are paginated and sorted by the ID in ascending order.

        **Please note:** As Customa may choose a lower page size than the provided one, it is recommended to use the
        value returned by the first request when scrolling through multiple result pages.
      operationId: receipt_search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptSearchResponse"
          description: A search response with receipts matching the search criteria.
      summary: Searches for receipts by the given filters.
      tags:
      - receipt
  /api/v3/search:
    post:
      deprecated: true
      description: |-
        Using the search API, entities can be filtered based on various criteria, which are combined using the boolean
        AND operator. Multiple values can be provided for a filter, these will be combined using the boolean OR operator.
        The results returned are paginated and sorted by the ID in ascending order.

        **Please note:** As Customa may choose a lower page size than the provided one, it is recommended to use the
        value returned by the first request when scrolling through multiple result pages.
      operationId: search
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacySearchResponse"
          description: The result.
      summary: Searches for entities by the given filters.
      tags:
      - search
  /api/v3/stats/receipt:
    post:
      operationId: stats_receipt
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsReceiptRequest"
        description: Request body for receipt statistics.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsReceiptResponse"
          description: The result.
      summary: Calculates receipt statistics
      tags:
      - stats
  /api/v3/stats/receipt/groupings:
    get:
      operationId: stats_receipt_groupings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoicesResponse"
          description: Grouping options for receipt statistics.
      summary: Returns a list of grouping options for receipt statistics.
      tags:
      - stats
  /api/v3/stats/receipt_item:
    post:
      operationId: stats_receipt_item
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsReceiptItemRequest"
        description: Request body for receipt item statistics.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsReceiptItemResponse"
          description: The result.
      summary: Calculates receipt item statistics
      tags:
      - stats
  /api/v3/stats/receipt_item/groupings:
    get:
      operationId: stats_receipt_item_groupings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoicesResponse"
          description: Grouping options for receipt statistics.
      summary: Returns a list of grouping options for receipt statistics.
      tags:
      - stats
components:
  schemas:
    ErrorResponse:
      description: Response returned if an error occured
      example:
        Message: Something bad happened.
      properties:
        Message:
          description: A message giving feedback about the error. The recipient's
            logic must not rely on its content.
          example: Something bad happened.
      required:
      - Message
      type: object
    AuthLoginRequest:
      description: Request body for authentication.
      example:
        Project: 10
        Username: user@customa.biz
        Password: secret123!
      properties:
        Username:
          description: Username (E-Mail address) used for authentication with Customa.
          example: user@customa.biz
          format: email
          type: string
        Password:
          description: Password for the User.
          example: secret123!
          type: string
        Project:
          description: ID of the project the user is authenticating for.
          example: 10
          type: integer
      required:
      - Password
      - Project
      - Username
      type: object
    AuthTokenResponse:
      description: Response of a successful authentication login request or token
        refresh.
      example:
        Expire: 2000-01-23T04:56:07.000+00:00
        Token: 044600149b8a50a2d00a32bc4ff9ac4bbdcdf82565e6b0900ded9daa4db77b55cb75eb58c71ae17af8634da8cce5d464735379f9b45c9ca4d3367d6eea9ea185
      properties:
        Token:
          description: "Random, hex encoded 64 Bytes used as a token for authentication."
          example: 044600149b8a50a2d00a32bc4ff9ac4bbdcdf82565e6b0900ded9daa4db77b55cb75eb58c71ae17af8634da8cce5d464735379f9b45c9ca4d3367d6eea9ea185
          type: string
        Expire:
          description: "The timestamp on which the token expires, provided in RFC3339\
            \ Format."
          format: date-time
          type: string
      required:
      - Expire
      - Token
      type: object
    SearchRequest:
      description: Request body for searching items.
      example:
        EntityType: Customer
        PageSize: 10
        Filter:
        - Field: EMail
          Type: MatchSuffix
          Values:
          - '@example.com'
          - '@example.com'
        - Field: EMail
          Type: MatchSuffix
          Values:
          - '@example.com'
          - '@example.com'
        Page: 1
      properties:
        Page:
          description: Number of the result page to be returned.
          example: 1
          type: integer
        PageSize:
          description: "Number of items per result page. Customa may choose a lower\
            \ value, please check the response."
          example: 10
          type: integer
        EntityType:
          deprecated: true
          description: Type of the entity to be searched. Only required in the generic
            search endpoint.
          enum:
          - Customer
          - Product
          - Receipt
          example: Customer
          type: string
        Filter:
          description: "Filters to be applied to the search. The filters are combined\
            \ using boolean AND. If a filter contains multiple values, these are combined\
            \ using boolean OR."
          items:
            $ref: "#/components/schemas/SearchFilter"
          type: array
      required:
      - Filter
      - Page
      - PageSize
      type: object
    SearchFilter:
      description: Filter to be applied to the search.
      example:
        Field: EMail
        Type: MatchSuffix
        Values:
        - '@example.com'
        - '@example.com'
      properties:
        Type:
          description: Type of the filter.
          enum:
          - IsEmpty
          - IsNotEmpty
          - Match
          - MatchPrefix
          - MatchSuffix
          - MatchInfix
          - LessThan
          - LessThanOrEqual
          - GreaterThan
          - GreaterThanOrEqual
          example: MatchSuffix
          type: string
        Field:
          description: Field to be filtered.
          example: EMail
          type: string
        Values:
          description: Values to be filtered using boolean OR.
          items:
            example: '@example.com'
            type: string
          type: array
      required:
      - Field
      - Type
      - Values
      type: object
    BasicSearchResponse:
      properties:
        TotalCount:
          description: Total number of items.
          example: 100
          type: integer
        CurrentPage:
          description: Current page number.
          example: 1
          type: integer
        PagesCount:
          description: Total number of pages.
          example: 10
          type: integer
        PageSize:
          description: Number of items per page.
          example: 10
          type: integer
      required:
      - CurrentPage
      - PageSize
      - PagesCount
      - TotalCount
      type: object
    CustomerSearchResponse:
      allOf:
      - $ref: "#/components/schemas/BasicSearchResponse"
      - properties:
          Customers:
            description: List of customers.
            items:
              $ref: "#/components/schemas/StrictCustomer"
            type: array
        type: object
      example:
        TotalCount: 100
        PageSize: 10
        CurrentPage: 1
        Customers:
        - CreationDate: 2000-01-23T04:56:07.000+00:00
          Group: group1
          Company: "ACME, Inc."
          Address: Musterweg 42
          Suburb: ""
          ContactBan: false
          PostalCode: "12345"
          Birthday: 1980-01-01
          Salutation: m
          ExternalCustomerID: 12345
          Segment: A1
          Newsletter: false
          ReferenceCustomer: false
          Number: K123456
          ModificationDate: 2000-01-23T04:56:07.000+00:00
          Phone: 123 456 7890
          ExternalOrderAccountID: 42
          ID: "12345"
          TestUser: false
          ExternalOrderSubAccountID: ExternalOrderSubAccountID
          FirstName: Max
          RegisterDate: 2000-01-23T04:56:07.000+00:00
          AdditionalFields:
          - Value: "42"
            Key: Example
          - Value: "42"
            Key: Example
          Title: Dr.
          City: Musterstadt
          EMail: EMail
          ReferrerChannel: direct
          ExternalCustomerExternalID: "12345"
          Marketplace: shop
          Referrer: example
          PurchaseDate: 2025-04-04T09:39:19.931Z
          Country: DE
          LastName: Mustermann
          ExternalOrderType: shop
        - CreationDate: 2000-01-23T04:56:07.000+00:00
          Group: group1
          Company: "ACME, Inc."
          Address: Musterweg 42
          Suburb: ""
          ContactBan: false
          PostalCode: "12345"
          Birthday: 1980-01-01
          Salutation: m
          ExternalCustomerID: 12345
          Segment: A1
          Newsletter: false
          ReferenceCustomer: false
          Number: K123456
          ModificationDate: 2000-01-23T04:56:07.000+00:00
          Phone: 123 456 7890
          ExternalOrderAccountID: 42
          ID: "12345"
          TestUser: false
          ExternalOrderSubAccountID: ExternalOrderSubAccountID
          FirstName: Max
          RegisterDate: 2000-01-23T04:56:07.000+00:00
          AdditionalFields:
          - Value: "42"
            Key: Example
          - Value: "42"
            Key: Example
          Title: Dr.
          City: Musterstadt
          EMail: EMail
          ReferrerChannel: direct
          ExternalCustomerExternalID: "12345"
          Marketplace: shop
          Referrer: example
          PurchaseDate: 2025-04-04T09:39:19.931Z
          Country: DE
          LastName: Mustermann
          ExternalOrderType: shop
        PagesCount: 10
      required:
      - Customers
      type: object
    ProductSearchResponse:
      allOf:
      - $ref: "#/components/schemas/BasicSearchResponse"
      - properties:
          Products:
            description: List of products.
            items:
              $ref: "#/components/schemas/StrictProduct"
            type: array
        type: object
      example:
        TotalCount: 100
        Products:
        - Status: true
          CreationDate: 2000-01-23T04:56:07.000+00:00
          RecommendedRetailPrice:
            Currency: EUR
            Value: 19.99
          Parent: "12344"
          AdditionalFields:
          - Value: "42"
            Key: Example
          - Value: "42"
            Key: Example
          TaxClass: Normal
          PurchasePrice:
            Currency: EUR
            Value: 19.99
          Vendor: ACME Inc.
          Name: Toaster
          ShortDescription: A toaster made of stainless steel.
          SalesPrice:
            Currency: EUR
            Value: 19.99
          EAN: "1234567890123"
          LongDescription: A toaster made of stainless steel with a 2-slice capacity
            and a 7-setting browning control.
          Number: PROD0001
          ModificationDate: 2000-01-23T04:56:07.000+00:00
          Manufacturer: ACME Inc.
          ID: "12345"
          ImageSource: https://example.com/image.jpg
          Stock: 100
        - Status: true
          CreationDate: 2000-01-23T04:56:07.000+00:00
          RecommendedRetailPrice:
            Currency: EUR
            Value: 19.99
          Parent: "12344"
          AdditionalFields:
          - Value: "42"
            Key: Example
          - Value: "42"
            Key: Example
          TaxClass: Normal
          PurchasePrice:
            Currency: EUR
            Value: 19.99
          Vendor: ACME Inc.
          Name: Toaster
          ShortDescription: A toaster made of stainless steel.
          SalesPrice:
            Currency: EUR
            Value: 19.99
          EAN: "1234567890123"
          LongDescription: A toaster made of stainless steel with a 2-slice capacity
