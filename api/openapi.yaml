    Customer:
      allOf:
      - $ref: "#/components/schemas/Timestamped"
      - properties:
          ID:
            description: "ID of the customer. Set internally by Customa, any given\
              \ value is ignored."
            example: "12345"
            type: string
          Number:
            description: Customer number from e.g. an external Shop or ERP System.
            example: K123456
            maxLength: 32
            type: string
          Group:
            description: Group name of the customer
            example: group1
            maxLength: 255
            nullable: true
            type: string
          Salutation:
            description: "Salutation of the customer. 'm' for male, 'f' for female\
              \ and 'x' for neither or unknown."
            enum:
            - m
            - f
            - x
            type: string
          Title:
            description: (Academical) title of the customer.
            example: Dr.
            maxLength: 30
            type: string
          FirstName:
            description: First name of the customer.
            example: Max
            maxLength: 256
            type: string
          LastName:
            description: Last name of the customer.
            example: Mustermann
            maxLength: 256
            type: string
          Company:
            description: Company of the customer's address
            example: "ACME, Inc."
            maxLength: 256
            type: string
          Address:
            description: (Street) address of the customer
            example: Musterweg 42
            maxLength: 256
            type: string
          PostalCode:
            description: Postal code of the customer's address
            example: "12345"
            maxLength: 16
            type: string
          Suburb:
            description: Suburb of the customer's address
            example: ""
            maxLength: 256
            type: string
          City:
            description: City of the customer's address
            example: Musterstadt
            maxLength: 256
            type: string
          Country:
            description: ISO3166-1 Alpha-2 Code of the customer's country
            example: DE
            maxLength: 2
            type: string
          EMail:
            description: Email address of the customer.
            format: email
            maxLength: 128
            type: string
          Phone:
            description: Phone number of the customer.
            example: 123 456 7890
            maxLength: 256
            type: string
          Birthday:
            description: Date of birth of the customer.
            example: 1980-01-01
            format: date
            nullable: true
            type: string
          Referrer:
            description: Referrer (last cookie) of the customer.
            example: example
            maxLength: 256
            type: string
          ReferrerChannel:
            description: Referrer Channel of the customer.
            example: direct
            maxLength: 32
            type: string
          RegisterDate:
            description: Registration date of the customer.
            format: date-time
            type: string
          PurchaseDate:
            description: Purchase date of the customer.
            example: 2025-04-04T09:39:19.931Z
            format: date-time
            nullable: true
            type: string
          AdditionalFields:
            description: Additional data for the customer.
            items:
              $ref: "#/components/schemas/AdditionalField"
            type: array
          ReferenceCustomer:
            description: Determines if the customer is a reference customer.
            example: false
            type: boolean
          ContactBan:
            description: Determines if the customer has an active contact ban.
            example: false
            type: boolean
          ExternalCustomerID:
            description: ID/Number of the customer in the source system (e.g. an ERP
              System)
            example: 12345
            type: integer
          ExternalCustomerExternalID:
            description: ID/Number of the customer in a secondary source system (e.g.
              the shop)
            example: "12345"
            maxLength: 64
            nullable: true
            type: string
          ExternalOrderType:
            example: shop
            maxLength: 20
            type: string
          ExternalOrderAccountID:
            example: 42
            type: integer
          ExternalOrderSubAccountID:
            maxLength: 64
            type: string
          Marketplace:
            description: Marketplace of the customer.
            example: shop
            maxLength: 64
            type: string
          TestUser:
            example: false
            type: boolean
          Newsletter:
            example: false
            type: boolean
          Segment:
            description: "Segment of the customer. Read-only, changes via the API\
              \ will have no effect. Will be required in Q1 2026."
            example: A1
            type: string
        type: object
