    StatsReceiptItemType:
      description: Statistics for a specific receipt type.
      example:
        ReceiptType: ReceiptType
        ReceiptCount: 0
        Amount: 1
        Revenue:
          Currency: Currency
          Value: 0.8008282
        CustomerCount: 6
        CostOfGoodsSold:
          Currency: Currency
          Value: 0.8008282
      properties:
        ReceiptType:
          description: The type of the receipt.
          title: Receipt Type.
          type: string
        ReceiptCount:
          description: The number of receipts of the specified type.
          title: Number of Receipts.
          type: integer
        CustomerCount:
          description: The number of customers who had at least one receipt of the
            specified type. This number may be lower than the `ReceiptCount` if some
            customers had multiple receipts of the specified type.
          title: Number of Customers.
          type: integer
