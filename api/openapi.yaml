          Quantity: 1
          ProductID: "12345"
          PurchasePrice:
            Currency: EUR
            Value: 19.99
          TaxClass: Normal
          ProductNumber: ProductNumber
          SellingPrice:
            Currency: EUR
            Value: 19.99
        - CreationDate: 2000-01-23T04:56:07.000+00:00
          ModificationDate: 2000-01-23T04:56:07.000+00:00
          Quantity: 1
          ProductID: "12345"
          PurchasePrice:
            Currency: EUR
            Value: 19.99
          TaxClass: Normal
