      - $ref: "#/components/schemas/Timestamped"
      - properties:
          ID:
            description: "ID of the receipt. Set internally by Customa, any given\
              \ value is ignored."
            example: "12345"
            type: string
          Type:
            description: Type of the receipt.
            example: RE
            maxLength: 2
            type: string
          Number:
            description: Receipt number
            example: RECEIPT0001
            maxLength: 255
            type: string
          CustomerID:
            description: ID of the customer.
            example: "12345"
            type: string
          ExternalOrderType:
            example: shop
            maxLength: 20
            type: string
          ExternalOrderID:
            example: 1234
            nullable: true
            type: integer
          ExternalOrderExternalID:
            example: "1234567890"
            maxLength: 64
            nullable: true
            type: string
          ExternalOrderAccountID:
            example: 42
            type: integer
          ExternalOrderSubAccountID:
            maxLength: 64
            type: string
          Marketplace:
            description: Marketplace of the receipt.
            maxLength: 64
            type: string
          PurchaseDate:
            description: Purchase date of the receipt.
            example: 2025-04-04T09:39:19.931Z
            format: date-time
            type: string
          DeliveryDate:
            deprecated: true
            description: Delivery date of the receipt. Will be removed in Q1 2026.
              Please use ReceiptDate instead.
            example: 2025-04-04T09:39:19.931Z
            format: date-time
            nullable: true
            type: string
          ReceiptDate:
            description: Date of the receipt.
            example: 2025-04-04T09:39:19.931Z
            format: date-time
            nullable: true
            type: string
          Referrer:
            description: Referrer (last cookie) of the customer when creating this
              receipt.
            example: example
            maxLength: 256
            nullable: true
            type: string
          ReferrerChannel:
            description: Referrer Channel of the customer when creating this receipt.
            example: direct
            maxLength: 32
            nullable: true
            type: string
          PaymentMethod:
            description: Payment method of the receipt.
            example: Credit Card
            maxLength: 64
            type: string
          RevenueNet:
            $ref: "#/components/schemas/Price"
          RevenueGross:
            $ref: "#/components/schemas/Price"
          ReceiptStatus:
            description: Status of the receipt.
            enum:
            - Open
            - InProgress
            - Completed
            - Cancelled
            type: string
          PaymentStatus:
            description: Payment status of the receipt.
            enum:
            - New
            - Paid
            - Cancelled
            - PaidPartially
            - Reminded
            - InProgress
            - Authorized
            - Refunded
            - RefundedPartially
            - Failed
            - Chargeback
            - Unconfirmed
            type: string
          DeliveryStatus:
            description: Delivery status of the receipt.
            enum:
            - Open
            - PartiallyShipped
            - Shipped
            - Returned
            - PartiallyReturned
            - Cancelled
            type: string
          GoogleClickID:
            description: Google Click ID of this receipt.
            example: "1234567890"
            maxLength: 128
            nullable: true
            type: string
          Items:
            description: List of items in the receipt.
            items:
              $ref: "#/components/schemas/StrictReceiptItem"
            type: array
          AdditionalFields:
            description: Additional field data for the receipt.
            items:
              $ref: "#/components/schemas/AdditionalField"
            type: array
        type: object
      example:
        CreationDate: 2000-01-23T04:56:07.000+00:00
        RevenueGross:
          Currency: EUR
          Value: 19.99
        GoogleClickID: "1234567890"
        CustomerID: "12345"
        DeliveryDate: 2025-04-04T09:39:19.931Z
        Number: RECEIPT0001
        ModificationDate: 2000-01-23T04:56:07.000+00:00
        ExternalOrderID: 1234
        DeliveryStatus: Open
        ExternalOrderAccountID: 42
        Items:
        - CreationDate: 2000-01-23T04:56:07.000+00:00
          ModificationDate: 2000-01-23T04:56:07.000+00:00
          Quantity: 1
          ProductID: "12345"
          PurchasePrice:
            Currency: EUR
            Value: 19.99
          TaxClass: Normal
          ProductNumber: ProductNumber
          SellingPrice:
            Currency: EUR
            Value: 19.99
        - CreationDate: 2000-01-23T04:56:07.000+00:00
          ModificationDate: 2000-01-23T04:56:07.000+00:00
          Quantity: 1
          ProductID: "12345"
          PurchasePrice:
            Currency: EUR
            Value: 19.99
          TaxClass: Normal
          ProductNumber: ProductNumber
          SellingPrice:
            Currency: EUR
            Value: 19.99
        ID: "12345"
        PaymentStatus: New
        ExternalOrderSubAccountID: ExternalOrderSubAccountID
        AdditionalFields:
        - Value: "42"
          Key: Example
        - Value: "42"
          Key: Example
        ExternalOrderExternalID: "1234567890"
        ReferrerChannel: direct
        Type: RE
        Marketplace: Marketplace
        PurchaseDate: 2025-04-04T09:39:19.931Z
        Referrer: example
        PaymentMethod: Credit Card
        ReceiptStatus: Open
        RevenueNet:
          Currency: EUR
          Value: 19.99
        ReceiptDate: 2025-04-04T09:39:19.931Z
        ExternalOrderType: shop
      type: object
    StrictReceipt:
      allOf:
      - $ref: "#/components/schemas/Receipt"
      example:
        CreationDate: 2000-01-23T04:56:07.000+00:00
        RevenueGross:
