    SettingDefinition:
      description: Definition of a setting.
      example:
        Type: String
        Description: Description
        Label: Label
        UseProjectFallback: true
        IsConfidential: true
      properties:
        Label:
          title: Display name of the setting.
          type: string
        Description:
          description: "A detailed explanation of the setting's purpose and usage.\
            \ This description should provide enough information for users to understand\
            \ what the setting does, how it affects the application, and any important\
            \ considerations or implications associated with changing its value."
          title: Description of the setting.
          type: string
        Type:
          $ref: "#/components/schemas/SettingType"
        IsConfidential:
          description: "A confidential setting contains sensitive information that\
            \ should be protected and not exposed in logs, error messages, or any\
            \ other output. Examples of confidential settings include API keys, passwords,\
            \ and other credentials. When a setting is marked as confidential, its\
            \ value cannot be retrieved through the API."
          title: Indicates whether the setting is confidential.
          type: boolean
        UseProjectFallback:
          description: "If true, the setting can fall back to a project-level value\
            \ if no marketplace-specific value is set. This allows for a hierarchical\
            \ configuration where a global value can be overridden by marketplace-specific\
            \ values, and if those are not set, the system can use a project-level\
            \ default value."
          title: Indicates whether the setting supports project fallback.
          type: boolean
      required:
      - Description
      - IsConfidential
      - Label
      - Type
      - UseProjectFallback
      title: Setting Definition
      type: object
    SettingsDefinition:
      description: Definition of all settings.
      example:
        Settings:
          key:
            Type: String
            Description: Description
            Label: Label
            UseProjectFallback: true
            IsConfidential: true
      properties:
        Settings:
          additionalProperties:
            $ref: "#/components/schemas/SettingDefinition"
          type: object
      required:
      - Settings
      title: Settings Definition
      type: object
