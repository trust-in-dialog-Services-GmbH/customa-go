          SellingPrice:
            Currency: EUR
            Value: 19.99
        ID: "12345"
        PaymentStatus: New
        ExternalOrderSubAccountID: ExternalOrderSubAccountID
        AdditionalFields:
        - Value: "42"
          Key: Example
        - Value: "42"
          Key: Example
        ExternalOrderExternalID: "1234567890"
        ReferrerChannel: direct
        Type: RE
        Marketplace: Marketplace
        PurchaseDate: 2025-04-04T09:39:19.931Z
        Referrer: example
        PaymentMethod: Credit Card
        ReceiptStatus: Open
        RevenueNet:
          Currency: EUR
          Value: 19.99
        ReceiptDate: 2025-04-04T09:39:19.931Z
        ExternalOrderType: shop
      required:
      - AdditionalFields
      - CustomerID
      - DeliveryStatus
      - ExternalOrderAccountID
      - ExternalOrderExternalID
      - ExternalOrderID
      - ExternalOrderSubAccountID
      - ExternalOrderType
      - GoogleClickID
      - Items
      - Number
      - PaymentMethod
      - PaymentStatus
      - PurchaseDate
      - ReceiptDate
      - ReceiptStatus
      - Referrer
      - ReferrerChannel
      - RevenueGross
      - RevenueNet
      - Type
    ReceiptItem:
      allOf:
      - $ref: "#/components/schemas/Timestamped"
      - properties:
          ProductID:
            description: ID of the product.
            example: "12345"
            type: string
          ProductNumber:
            description: Product number of the product.
            type: string
          Quantity:
            description: Quantity of the product.
            example: 1
            type: integer
          SellingPrice:
            $ref: "#/components/schemas/Price"
          PurchasePrice:
            $ref: "#/components/schemas/Price"
          TaxClass:
            description: "Tax class of the item. For example, in Germany, 19% VAT\
              \ would be 'Normal' while 7% VAT would be 'Reduced'."
            enum:
            - Normal
            - Reduced
            - HighlyReduced
            - None
            type: string
        type: object
      type: object
    StrictReceiptItem:
      allOf:
      - $ref: "#/components/schemas/ReceiptItem"
      example:
        CreationDate: 2000-01-23T04:56:07.000+00:00
        ModificationDate: 2000-01-23T04:56:07.000+00:00
        Quantity: 1
        ProductID: "12345"
        PurchasePrice:
          Currency: EUR
          Value: 19.99
        TaxClass: Normal
        ProductNumber: ProductNumber
        SellingPrice:
          Currency: EUR
          Value: 19.99
      required:
      - ProductID
      - ProductNumber
      - Quantity
      - SellingPrice
      - TaxClass
    AdditionalField:
      description: Additional field data.
      example:
        Value: "42"
        Key: Example
      properties:
        Key:
          example: Example
          type: string
        Value:
          example: "42"
          type: string
      required:
      - Key
      - Value
      type: object
    ChoicesResponse:
      description: Response containing choices with key and value pairs.
      example:
        Choices:
        - Label: Example Value
          Key: example_key
        - Label: Example Value
          Key: example_key
      properties:
        Choices:
          items:
            $ref: "#/components/schemas/ChoicesResponse_Choices_inner"
          type: array
      required:
      - Choices
      type: object
    StatsReceiptRequest:
      description: Request body for statistics on receipts.
      example:
        GroupBy: day
        Filter:
        - Field: EMail
          Type: MatchSuffix
          Values:
          - '@example.com'
          - '@example.com'
        - Field: EMail
          Type: MatchSuffix
          Values:
          - '@example.com'
          - '@example.com'
        From: 2025-01-01T00:00:00Z
        To: 2025-12-31T23:59:59.999Z
        DateField: PurchaseDate
      properties:
        From:
          description: Start date for the statistics in RFC3339 format.
          example: 2025-01-01T00:00:00Z
          format: date-time
          type: string
        To:
          description: End date for the statistics in RFC3339 format.
          example: 2025-12-31T23:59:59.999Z
          format: date-time
          type: string
        DateField:
          description: Type of the date to be used for the time range and time-based
            grouping.
          enum:
          - PurchaseDate
          - ReceiptDate
          type: string
        GroupBy:
          description: Grouping criteria for the statistics. This may depend on dynamically
            configured fields. Use the stats_receipt_groupings endpoint to retrieve
            a list of available groupings.
          example: day
          type: string
        Filter:
          description: Optional filter for the statistics.
          items:
            $ref: "#/components/schemas/SearchFilter"
          type: array
      required:
      - DateField
      - Filter
      - From
      - GroupBy
      - To
      type: object
    StatsReceiptResponse:
      description: Response containing statistics on receipts.
      example:
        Groups:
        - GroupName: 08/2025
          Types:
          - ReceiptType: RE
            ReceiptCount: 123
            Revenue:
              Currency: EUR
              Value: 19.99
            CustomerCount: 456
            CostOfGoodsSold:
              Currency: EUR
              Value: 19.99
          - ReceiptType: RE
            ReceiptCount: 123
            Revenue:
              Currency: EUR
              Value: 19.99
            CustomerCount: 456
            CostOfGoodsSold:
              Currency: EUR
              Value: 19.99
          GroupKey: 2025-08-01
        - GroupName: 08/2025
          Types:
          - ReceiptType: RE
            ReceiptCount: 123
            Revenue:
              Currency: EUR
              Value: 19.99
            CustomerCount: 456
            CostOfGoodsSold:
