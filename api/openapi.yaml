openapi: 3.0.0
info:
  description: E-Commerce BI & CRM Tool
  title: Customa
  version: 3.12.0
servers:
- description: Customa
  url: https://www.customa.biz/
tags:
- description: auth
  name: auth
- description: customer
  name: customer
- description: product
  name: product
- description: receipt
  name: receipt
- description: segment
  name: segment
- description: settings
  name: settings
- description: stats
  name: stats
- description: category
  name: category
- description: project
  name: project
- description: traffic
  name: traffic
paths:
  /api/v3/auth/login:
    post:
      deprecated: true
      description: |-
        A user is authenticated using their username and password and a project ID. If the credentials are valid, a token
        is returned that can be used for further API requests. The token is valid for a limited time and can be refreshed
        using the refresh endpoint. It is recommended to refresh the token at least 10 minutes before it expires to
        ensure uninterrupted access to the API.
      operationId: auth_login_v3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequestV3"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponseV3"
          description: The authentication was successful.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseV3"
          description: The request body is invalid or malformed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseV3"
          description: Invalid credentials provided.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseV3"
          description: Insufficient permissions to access the API or the project.
      security: []
      summary: Authentication of a user for the API.
      tags:
      - auth
  /api/v3/auth/logout:
    post:
      deprecated: true
      description: The logout endpoint allows a user to manually invalidate their
        current API authentication token.
      operationId: auth_logout_v3
      responses:
        "200":
          description: The current token was successfully deleted.
      security:
      - apiV3Token: []
      summary: Manually invalidate an API Auth Token.
      tags:
      - auth
  /api/v3/auth/refresh:
    post:
      deprecated: true
      description: |-
        This endpoint allows a user to refresh their current API authentication token. The current token will be
        invalidated, and a new token will be issued with an updated expiration time.
      operationId: auth_refresh_v3
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponseV3"
          description: The current token was successfully refreshed.
      security:
      - apiV3Token: []
      summary: Refresh an API Auth Token.
      tags:
      - auth
  /api/v3/customer:
    post:
      deprecated: true
      description: A new customer is created and the ID of the created customer is
        returned.
      operationId: customer_post_v3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictCustomer"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreatedResponse"
          description: The customer was successfully created.
      security:
      - apiV3Token: []
      summary: Creates a new Customer.
      tags:
      - customer
  /api/v3/customer/{id}:
    delete:
      deprecated: true
      operationId: customer_delete_v3
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: The customer was found and deleted.
        "404":
          description: The customer was not found.
        "409":
          description: The customer could not be deleted because it is referenced
            by other entities.
      security:
      - apiV3Token: []
      summary: Deletes a customer with the given ID.
      tags:
      - customer
    get:
      deprecated: true
      operationId: customer_get_v3
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrictCustomer"
          description: The customer was found.
        "404":
          description: The customer was not found.
      security:
      - apiV3Token: []
      summary: Retrieves a customer by their ID.
      tags:
      - customer
    patch:
      deprecated: true
      description: |-
        This method allows for partial updates to a customer's data. Only the fields provided in the request body will
        be updated, leaving other fields unchanged.
      operationId: customer_patch_v3
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Customer"
        required: true
      responses:
        "200":
          description: The customer was successfully updated.
        "404":
          description: The customer was not found.
      security:
      - apiV3Token: []
      summary: Updates a customer with the given ID partially.
      tags:
      - customer
    put:
      deprecated: true
      description: |-
        The customer must already exist in the system. All customer data is replaced with the data provided in the
        request body.
      operationId: customer_put_v3
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictCustomer"
        required: true
      responses:
        "200":
          description: The customer was successfully updated.
        "404":
          description: The customer was not found.
      security:
      - apiV3Token: []
      summary: Overwrites a customer with the given ID.
      tags:
      - customer
  /api/v3/customer/search:
    post:
      deprecated: true
      description: |-
        Using the search endpoint, customers can be filtered based on various criteria, which are combined using the
        boolean AND operator. Multiple values can be provided for a filter, these will be combined using the boolean OR
        operator. The results returned are paginated and sorted by the ID in ascending order.

        **Please note:** As Customa may choose a lower page size than the provided one, it is recommended to use the
        value returned by the first request when scrolling through multiple result pages.
      operationId: customer_search_v3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerSearchResponse"
          description: A search response with customers matching the search criteria.
      security:
      - apiV3Token: []
      summary: Searches for customers by the given filters.
      tags:
      - customer
  /api/v3/product:
    post:
      deprecated: true
      description: A new product is created using the provided data. The product ID
        is returned in the response.
      operationId: product_post_v3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictProduct"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreatedResponse"
          description: The product was successfully created.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseV3"
          description: A product with this number already exists.
      security:
      - apiV3Token: []
      summary: Creates a new Product.
      tags:
      - product
  /api/v3/product/{id}:
    delete:
      deprecated: true
      operationId: product_delete_v3
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: The product was successfully deleted.
        "404":
          description: The product was not found.
        "409":
          description: The product cannot be deleted because it is referenced by other
            entities.
      security:
      - apiV3Token: []
      summary: Deletes a product by its ID.
      tags:
      - product
    get:
      deprecated: true
      operationId: product_get_v3
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrictProduct"
          description: The product was successfully retrieved.
        "404":
          description: The product was not found.
      security:
      - apiV3Token: []
      summary: Retrieves a product by its ID.
      tags:
      - product
    patch:
      deprecated: true
      description: |-
        This method allows for partial updates to a product's data. Only the fields provided in the request body will be
        updated.
      operationId: product_patch_v3
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Product"
        required: true
      responses:
        "200":
          description: The product was successfully updated.
        "404":
          description: The product was not found.
      security:
      - apiV3Token: []
      summary: Updates a product partially by its ID.
      tags:
      - product
    put:
      deprecated: true
      description: The product must already exist. The provided data will replace
        the existing product data.
      operationId: product_put_v3
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictProduct"
        required: true
      responses:
        "200":
          description: The product was successfully updated.
        "404":
          description: The product was not found.
      security:
      - apiV3Token: []
      summary: Overwrites an existing product with the given ID.
      tags:
      - product
  /api/v3/product/search:
    post:
      deprecated: true
      description: |-
        Using the search endpoint, products can be filtered based on various criteria, which are combined using the
        boolean AND operator. Multiple values can be provided for a filter, these will be combined using the boolean OR
        operator. The results returned are paginated and sorted by the ID in ascending order.

        **Please note:** As Customa may choose a lower page size than the provided one, it is recommended to use the
        value returned by the first request when scrolling through multiple result pages.
      operationId: product_search_v3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSearchResponse"
          description: A search response with products matching the search criteria.
      security:
      - apiV3Token: []
      summary: Searches for products by the given filters.
      tags:
      - product
  /api/v3/receipt:
    post:
      deprecated: true
      description: A receipt is created using the provided JSON data. The ID of the
        created receipt is returned in the response.
      operationId: receipt_post_v3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictReceipt"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreatedResponse"
          description: The receipt was successfully created.
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseV3"
          description: A receipt with this number already exists.
      security:
      - apiV3Token: []
      summary: Creates a new receipt.
      tags:
      - receipt
  /api/v3/receipt/{id}:
    delete:
      deprecated: true
      operationId: receipt_delete_v3
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: The receipt was successfully deleted.
        "404":
          description: The receipt was not found.
      security:
      - apiV3Token: []
      summary: Deletes a receipt by its ID.
      tags:
      - receipt
    get:
      deprecated: true
      operationId: receipt_get_v3
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StrictReceipt"
          description: The receipt was successfully retrieved.
        "404":
          description: The receipt was not found.
      security:
      - apiV3Token: []
      summary: Retrieves a receipt by its ID.
      tags:
      - receipt
    patch:
      deprecated: true
      description: |-
        The receipt must already exist. The provided data will be merged with the existing receipt data. Any receipt
        item that is not present in the request will remain unchanged. If the provided data contains receipt items, the
        existing receipt items will be replaced with the provided items.
      operationId: receipt_patch_v3
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Receipt"
        required: true
      responses:
        "200":
          description: The receipt was successfully updated.
        "404":
          description: The receipt was not found.
      security:
      - apiV3Token: []
      summary: Partially updates an existing receipt with the given ID.
      tags:
      - receipt
    put:
      deprecated: true
      description: |-
        The receipt must already exist. The provided data will replace the existing receipt data. Any receipt item that
        is not present in the request will be removed from the receipt.
      operationId: receipt_put_v3
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StrictReceipt"
        required: true
      responses:
        "200":
          description: The receipt was successfully updated.
        "404":
          description: The receipt was not found.
      security:
      - apiV3Token: []
      summary: Overwrites an existing receipt with the given ID.
      tags:
      - receipt
  /api/v3/receipt/search:
    post:
      deprecated: true
      description: |-
        Using the search endpoint, receipts can be filtered based on various criteria, which are combined using the
        boolean AND operator. Multiple values can be provided for a filter, these will be combined using the boolean OR
        operator. The results returned are paginated and sorted by the ID in ascending order.

        **Please note:** As Customa may choose a lower page size than the provided one, it is recommended to use the
        value returned by the first request when scrolling through multiple result pages.
      operationId: receipt_search_v3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptSearchResponse"
          description: A search response with receipts matching the search criteria.
      security:
      - apiV3Token: []
      summary: Searches for receipts by the given filters.
      tags:
      - receipt
  /api/v3/segment:
    get:
      deprecated: true
      description: |-
        Returns an array of customer segments with their RFM metrics (Recency, Frequency, Monetary)
        and lifetime value data for customer segmentation and analysis.
      operationId: segments_get_v3
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentList"
          description: The result.
      security:
      - apiV3Token: []
      summary: Retrieve Customer Segments.
      tags:
      - segment
  /api/v3/segment/definition:
    get:
      deprecated: true
      operationId: definition_get_v3
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentDefinition"
          description: The result.
      security:
      - apiV3Token: []
      summary: Returns Customer Segment Data.
      tags:
      - segment
  /api/v3/settings:
    get:
      deprecated: true
      operationId: settings_list_v3
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDefinition"
          description: The settings definition.
      security:
      - apiV3Token: []
      summary: Returns a definition of the available settings.
      tags:
      - settings
  /api/v3/settings/{name}:
    get:
      deprecated: true
      operationId: settings_get_v3
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Setting"
          description: The setting was found.
        "403":
          description: The setting is confidential and is not readable via the API.
        "404":
          description: The setting was not found.
      security:
      - apiV3Token: []
      summary: Returns the values of a given setting.
      tags:
      - settings
  /api/v3/settings/{name}/validate:
    post:
      deprecated: true
      operationId: settings_validate_v3
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Setting"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingValidationResponse"
          description: The setting was found validated.
        "404":
          description: The setting was not found.
      security:
      - apiV3Token: []
      summary: Validates the given setting.
      tags:
      - settings
  /api/v3/stats/receipt:
    post:
      deprecated: true
      operationId: stats_receipt_v3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsRequest"
        description: Request body for receipt statistics.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsReceiptGroups"
          description: The result.
      security:
      - apiV3Token: []
      summary: Calculates receipt statistics.
      tags:
      - stats
  /api/v3/stats/receipt/groupings:
    get:
      deprecated: true
      operationId: stats_receipt_groupings_v3
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoicesList"
          description: Grouping options for receipt statistics.
      security:
      - apiV3Token: []
      summary: Returns a list of grouping options for receipt statistics.
      tags:
      - stats
  /api/v3/stats/receipt_item:
    post:
      deprecated: true
      operationId: stats_receipt_item_v3
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatsRequest"
        description: Request body for receipt item statistics.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsReceiptItemGroups"
          description: The result.
      security:
      - apiV3Token: []
      summary: Calculates receipt item statistics.
      tags:
      - stats
  /api/v3/stats/receipt_item/groupings:
    get:
      deprecated: true
      operationId: stats_receipt_item_groupings_v3
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChoicesList"
          description: Grouping options for receipt statistics.
      security:
      - apiV3Token: []
      summary: Returns a list of grouping options for receipt statistics.
      tags:
      - stats
  /api/v4/auth/login:
    post:
      description: "This endpoint allows users to authenticate using their username\
        \ and password. Upon successful authentication, a token is returned that can\
        \ be used for subsequent API requests. The token is valid for a limited time\
        \ and should be refreshed by reauthenticating before it expires to ensure\
        \ uninterrupted access to the API."
      operationId: auth_login_v4
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequestV4"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponseV4"
          description: The authentication was successful.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseV4"
          description: The request body is invalid or malformed.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponseV4"
          description: Invalid credentials provided.
      security: []
      summary: API Endpoint for JSON authentication.
      tags:
      - auth
  /api/v4/category/{project}:
    post:
      operationId: category_post_v4
      parameters:
      - explode: false
        in: path
        name: project
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryV4"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemCreatedResponse2"
          description: The category was successfully created.
        "422":
          description: The provided data is invalid.
      security:
      - apiV4Token: []
        apiV4BasicAuth: []
      summary: Creates a new category.
      tags:
      - category
  /api/v4/category/{project}/{id}:
    delete:
      operationId: category_delete_v4
      parameters:
      - explode: false
        in: path
        name: project
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: The category was successfully deleted.
        "404":
          description: The category was not found.
        "409":
          description: The category cannot be deleted because it is referenced by
            child categories or products.
      security:
      - apiV4Token: []
        apiV4BasicAuth: []
      summary: Deletes a category by its ID.
      tags:
      - category
    get:
      operationId: category_get_v4
      parameters:
      - explode: false
        in: path
        name: project
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryV4"
          description: The category was successfully retrieved.
        "404":
          description: The category was not found.
      security:
      - apiV4Token: []
        apiV4BasicAuth: []
      summary: Retrieves a category by its ID.
      tags:
      - category
    put:
      operationId: category_put_v4
      parameters:
      - explode: false
        in: path
        name: project
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryV4"
        required: true
      responses:
        "200":
          description: The category was successfully updated.
        "404":
          description: The category was not found.
        "422":
          description: The provided data is invalid or would create a circular reference.
      security:
      - apiV4Token: []
        apiV4BasicAuth: []
      summary: Overwrites an existing category with the given ID.
      tags:
      - category
  /api/v4/category/{project}/search:
    post:
      operationId: category_search_v4
      parameters:
      - explode: false
        in: path
        name: project
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorySearchResponseV4"
          description: A search response with categories matching the search criteria.
      security:
      - apiV4Token: []
        apiV4BasicAuth: []
      summary: Searches for categories by the given filters.
      tags:
      - category
  /api/v4/customer/{project}:
    post:
      description: A new customer is created using the provided data. The customer
        ID is returned in the response.
