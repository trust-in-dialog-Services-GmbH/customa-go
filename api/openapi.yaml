          description: "An associative array where the keys are marketplace identifiers\
            \ (e.g., 'shop1', 'shop2') and the values are the marketplace-specific\
            \ values for the setting. These values override the global value for their\
            \ respective marketplaces. The values can be of type string, integer,\
            \ float, or boolean, depending on the specific setting being represented."
          example:
            shop1: 43
            shop2: 44
          title: Marketplace Setting Value.
          type: object
      required:
      - Global
      - Marketplaces
      title: Setting
      type: object
