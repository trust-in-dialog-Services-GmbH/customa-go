          type: string
        GroupName:
          description: "A human-readable name of the group, e.g. a date for daily\
            \ grouping, a week number for weekly grouping, a month name for monthly\
            \ grouping or a year number for yearly grouping. This field is only for\
            \ display purposes and may be localized, e.g. the month name may be localized\
            \ to the language of the request. The `GroupKey` field should be used\
            \ for grouping and filtering purposes, as it is not localized and has\
            \ a consistent format."
          title: Group Name.
          type: string
        Types:
